# ------------------------------------------------------------------ colour (optional, off by default)
# Geostandard 6.12 hydrocarbon-type colours, for outputs that must follow the standard exactly. Oil green against gas red is not safe
# for colour-blind readers, so the default is ink only and symbols never rely on these.
[colours.geostandard]
note = "Geostandard 6.12 and 6.4; for exchange outputs. Not colour-vision safe: oil green against gas red."
oil = "#02db00"
gas = "#ff0000"
condensate = "#ffbee8"
gas_hydrates = "#b03f97"
hydrocarbons = "#ffcb05"
unknown = "#6083a8"
co2 = "#cdbd66"
cyan = "#00c5ff"      # start/end point; the standard draws it light blue
red = "#ff0000"       # platform, anchor, midline buoy, flare platform
blue = "#6c8ebf"      # rig

# ------------------------------------------------------------------ examples: the standard's own selections, as tests and as the review sheet
# `well` gives the composition; `std` the section and what the standard calls it. Fluids are [fluid, qualifier] pairs, or "dry".

[[example]]
std = "3.4.2"
label = "Proposed well"
well = { technical = "proposed" }
[[example]]
std = "3.4.2"
label = "Well abandoned for technical reasons"
well = { technical = "abandoned_technical" }
[[example]]
std = "3.4.2"
