# SubScout symbol source of truth: wellbores, wells and installations.
#
# Vocabulary and meaning follow the Sodir Geostandard, version 22.00 (2022), section 3.4 (well symbols) and 3.5 (installations).
# The shapes are redrawn here, not copied. Where a drawing is simplified from the standard it says `simplified = true`.
# Meaning is carried by SHAPE; colour is secondary and optional (styleguide/wellbores.md).
#
# Wells are COMPOSED, as the standard composes them: a base circle, a layer per fluid, a layer for technical status and a layer for
# function. "Oil well, plugged and abandoned" is the oil layer plus the plugged-and-abandoned layer. The standard lists a selection of
# combinations and says others follow the same principle; the [[example]] tables below are those selections, and they are tests.
#
# Drawing language: every symbol is a list of primitives in a box from -50 to 50 on both axes, y downwards, centre 0 0. Strings:
#   "c cx cy r"            circle outline          "C cx cy r"        filled disc
#   "l x1 y1 x2 y2"        line                    "r x y w h"        rectangle outline     "R x y w h"  filled rectangle
#   "p d"                  path outline (SVG d)    "P d"              filled path
#   "rays cx cy r0 r1 a0 da n"   n lines from radius r0 to r1, first at angle a0 (degrees, clockwise from +x, y down), step da
#   "w cx cy r a0 a1"      sector outline          "W cx cy r a0 a1"  filled sector
#   "t x y size text"      text
# A leading "~" makes the stroke dashed ("~r -30 -30 60 60"). Stroke width is [meta].stroke unless a symbol sets its own.
# Filled shapes use the ink colour; there is no other colour in a symbol.

[meta]
source = "Sodir Geostandard v22.00 (2022), sections 3.4 and 3.5; redrawn, not copied"
box = 50            # symbols are drawn in -50..50
stroke = 6          # stroke width in box units (6 is 1.4 px at 24 px)
min_size_px = 10    # below this a symbol is not drawn: use a plain dot
code_min_size_px = 18   # letter codes (F, P, W, R, ...) are dropped below this size, as the standard says to fit codes to scale
sizes = { small = 12, medium = 18, large = 26 }

# ------------------------------------------------------------------ wells: layers

[layer.base]
label = "Well position"
std = "3.4.2"
parts = ["c 0 0 16"]

# fluids: three fluids, three qualifiers. proven = the main fluid; minor = minor amounts or uncertain producibility;
# trace = residual or immobile, traces. "dry" is the absence of hydrocarbons.
[layer."fluid.dry"]
label = "Dry well (zone)"
std = "3.4.2"
parts = ["rays 0 0 16 28 0 90 4"]

[layer."fluid.oil.proven"]
label = "Oil well (oil-bearing zone)"
std = "3.4.2"
parts = ["C 0 0 16"]
[layer."fluid.oil.minor"]
label = "Minor oil, or oil of uncertain producibility"
std = "3.4.2"
parts = ["P M-16 0 A16 16 0 0 0 16 0 Z"]
[layer."fluid.oil.trace"]
label = "Residual oil, traces of oil"
std = "3.4.2"
parts = ["P M0 0 L16 0 A16 16 0 0 1 0 16 Z"]

[layer."fluid.gas.proven"]
label = "Gas well (gas-bearing zone)"
std = "3.4.2"
parts = ["rays 0 0 21 33 0 45 8"]
[layer."fluid.gas.minor"]
label = "Minor gas, or gas of uncertain producibility"
std = "3.4.2"
parts = ["rays 0 0 21 33 180 45 5"]
[layer."fluid.gas.trace"]
label = "Residual gas, traces of gas"
std = "3.4.2"
simplified = true   # the standard shows a small tab on top of the circle
parts = ["rays 0 0 20 30 180 90 3"]

[layer."fluid.condensate.proven"]
label = "Condensate well (condensate-bearing zone)"
std = "3.4.2"
simplified = true   # four filled lobes; the standard's lobes are slightly rounder
parts = ["W 0 0 30 20 70", "W 0 0 30 110 160", "W 0 0 30 200 250", "W 0 0 30 290 340"]
[layer."fluid.condensate.minor"]
label = "Minor condensate"
std = "3.4.2"
simplified = true
parts = ["w 0 0 30 20 70", "w 0 0 30 110 160", "w 0 0 30 200 250", "w 0 0 30 290 340"]

[layer."fluid.coal"]
label = "Coal"
std = "3.4.2"
simplified = true
parts = ["c 0 0 18", "p M8 -9 A11 11 0 1 0 8 9"]

# technical status: what happened to the well. "open" (the default) adds nothing.
[layer."tech.proposed"]
label = "Proposed well"
std = "3.4.2"
parts = []
[layer."tech.abandoned_technical"]
label = "Abandoned for technical reasons (target not reached)"
std = "3.4.2"
parts = ["l -16 0 16 0", "l 0 -16 0 16"]
[layer."tech.temporarily_abandoned"]
label = "Temporarily abandoned or shut in"
std = "3.4.2"
parts = ["l -44 0 44 0"]
[layer."tech.plugged_abandoned"]
label = "Plugged and abandoned"
std = "3.4.2"
parts = ["l -44 0 44 0", "l 0 -44 0 44"]
[layer."tech.not_observed"]
label = "Mapped unit not observed (F faulted, NR not reached, NP not present)"
std = "3.4.2"
parts = ["l -16 -16 16 16"]

# function: what the well does. Arrows point out of the symbol for production and into it for injection.
[layer."fn.production"]
label = "Production"
std = "3.4.4"
parts = ["l 12 -12 30 -30", "P M36 -36 L23 -32 L32 -23 Z"]
[layer."fn.injection"]
label = "Injection"
std = "3.4.4"
parts = ["l -12 12 -30 30", "P M-36 36 L-23 32 L-32 23 Z"]
[layer."fn.converted"]
label = "Converted well (former producer, now injector)"
std = "3.4.4"
parts = ["l -12 12 -30 30", "P M-36 36 L-23 32 L-32 23 Z", "c -38 38 3"]
[layer."fn.observation"]
label = "Observation well"
std = "3.4.4"
parts = ["l -11 -11 11 11", "l -11 11 11 -11"]
[layer."fn.dual_completion"]
label = "Dual completion (separate production from two zones)"
std = "3.4.4"
parts = ["c 0 0 25"]
[layer."fn.shut_in"]
label = "Shut in (reason code W, R, G, S or E)"
std = "3.4.4"
parts = ["l -44 0 44 0"]
[layer."fn.injected.water"]
label = "Water injection"
std = "3.4.4"
simplified = true
parts = ["l -11 11 11 -11"]
[layer."fn.injected.cuttings"]
label = "Cuttings injection"
std = "3.4.4"
simplified = true
parts = ["p M0 -9 L9 0 L0 9 L-9 0 Z"]
[layer."fn.injected.co2"]
label = "CO2 injection"
std = "3.4.4"
simplified = true
parts = ["c 0 0 8", "C 0 0 3"]
[layer."zone.above"]
label = "Function applies to a level shallower than the mapped zone"
std = "3.4.4"
parts = ["l 0 -16 0 -38", "P M0 -44 L-6 -34 L6 -34 Z"]
[layer."zone.below"]
label = "Function applies to a level deeper than the mapped zone"
std = "3.4.4"
parts = ["l 0 16 0 38", "P M0 44 L-6 34 L6 34 Z"]

# active exploration wells replace the base circle
[layer."explore.wildcat"]
label = "Wildcat"
std = "3.4.7"
parts = ["c 0 0 20", "C 0 0 8"]
[layer."explore.appraisal"]
label = "Appraisal"
std = "3.4.7"
parts = ["c 0 0 22", "c 0 0 12"]

# a shallow borehole is its own symbol
[layer.shallow_borehole]
label = "Shallow borehole (25 to 200 m below seabed)"
std = "3.4.2"
simplified = true
parts = ["c 0 0 8", "l -22 -22 22 22", "l -22 22 22 -22", "l -22 -22 22 -22", "l -22 22 22 22"]

# general class of well: the standard uses coloured dots only (3.4.9). SubScout adds a shape to each so that class never rests on colour.
[layer."class.development"]
label = "Development or service well"
std = "3.4.9"
parts = ["C 0 0 11"]
[layer."class.exploratory"]
label = "Exploratory well"
std = "3.4.9"
parts = ["P M0 -14 L14 0 L0 14 L-14 0 Z"]
[layer."class.injector"]
label = "Injector"
std = "3.4.9"
parts = ["P M0 13 L14 -11 L-14 -11 Z"]
[layer."class.non_hydrocarbon"]
label = "Non-hydrocarbon well"
std = "3.4.9"
parts = ["R -11 -11 22 22"]

# platform and subsea installation at the well level (3.4.2); the full installation list is below
[layer."well.platform.proposed"]
label = "Proposed platform or installation"
std = "3.4.2"
parts = ["~r -24 -24 48 48"]
[layer."well.platform"]
label = "Platform"
std = "3.4.2"
parts = ["r -24 -24 48 48"]
[layer."well.subsea"]
label = "Subsea installation"
std = "3.4.2"
parts = ["p M-24 -12 L-24 -24 L-12 -24", "p M12 -24 L24 -24 L24 -12", "p M24 12 L24 24 L12 24", "p M-12 24 L-24 24 L-24 12"]

# trajectory line styles (3.4.5); drawn by the map, listed here so the legend has them
[trajectory.actual]
label = "Well trajectory"
std = "3.4.5"
dash = ""
[trajectory.approximate]
label = "Approximate well trajectory"
std = "3.4.5"
dash = "1 5"
[trajectory.planned]
label = "Planned well trajectory"
std = "3.4.5"
dash = "9 7"

# ------------------------------------------------------------------ installations (Geostandard 3.5)
# The standard draws each installation once and its planned variant in grey: here planned is the same shape in the muted tone.
# `std_colour` is the colour the standard gives it; it applies only when the Geostandard colour preset is on.
# Several installations share one shape in the standard (anchors and subsea objects); they stay distinct by name.

[installation.dead_man_anchor]
label = "Dead Man anchor (DMA)"
parts = ["p M-24 -12 L-24 -24 L-12 -24", "p M12 -24 L24 -24 L24 -12", "p M24 12 L24 24 L12 24", "p M-12 24 L-24 24 L-24 12"]
[installation.diverless_latch]
