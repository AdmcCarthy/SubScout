parts = ["p M-24 -12 L-24 -24 L-12 -24", "p M12 -24 L24 -24 L24 -12", "p M24 12 L24 24 L12 24", "p M-12 24 L-24 24 L-24 12"]
[installation.start_end_point]
label = "Start or end point"
std_colour = "cyan"
parts = ["p M0 -16 L16 0 L0 16 L-16 0 Z"]
[installation.anchor]
