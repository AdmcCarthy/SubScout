# SubScout colour source of truth.
#
# Method ported from the Equinor Design System colour palette generator
# (MIT, (c) Equinor ASA, github.com/equinor/design-system, ADR 0016):
#   step colour = oklch( L[step], gaussian(L[step]) * anchor.C, anchor.H )
# Only an anchor's hue and chroma are used; lightness always comes from the
# shared ladder. To add a colour, add an anchor below: it inherits the ladder,
# the chroma curve, the step roles and the contrast tests automatically.
#
# Names are SubScout's own (geological). SubScout is not affiliated with Equinor.

[scale]
steps = 15
# Hand-set OKLCH lightness per step (EDS input/scale). Dark mode is not a
# mirror: steps 3-5 "dip" for selected/border states, 14-15 are inverse steps.
light = [0.98, 0.94, 0.91, 0.87, 0.82, 0.77, 0.72, 0.62, 0.52, 0.47, 0.42, 0.37, 0.32, 0.90, 1.00]
dark  = [0.215, 0.226, 0.47, 0.30, 0.45, 0.595, 0.61, 0.76, 0.82, 0.88, 0.93, 0.96, 0.99, 0.33, 0.10]

[scale.gaussian]
# chroma multiplier = exp(-25/std_dev * (L - mean)^2); peaks in the mid-tones.
light = { mean = 0.6, std_dev = 2 }
dark  = { mean = 0.7, std_dev = 2 }

# ---------------------------------------------------------------- hues
# anchor = [L, C, H] in OKLCH. `group` documents intent:
#   core      - identity colours used for surfaces, text and most data
#   highlight - used sparingly: annotation, change, status; never large areas
#   data      - only used inside data palettes
[hues.fjord]       # EDS "Moss Green"
anchor = [0.4973, 0.084851, 204.553]
group = "core"

[hues.slate]       # EDS "Gray"
anchor = [0.4091, 0.0, 0.0]
group = "core"

[hues.shale]       # EDS "North Sea"
anchor = [0.3274, 0.0363, 242.96]
group = "core"

[hues.cobalt]      # EDS "Blue"
anchor = [0.5857, 0.135751, 240.6802]
group = "core"

[hues.malachite]   # EDS "Green"
anchor = [0.6291, 0.1659, 142.98]
group = "highlight"

[hues.ochre]       # EDS "Orange"
anchor = [0.6934, 0.164689, 58.7381]
group = "highlight"

[hues.haematite]   # EDS "Red"
anchor = [0.5776, 0.2314, 21.12]
group = "highlight"

[hues.amethyst]    # SubScout addition (not in EDS): violet for identity palettes
anchor = [0.55, 0.15, 305.0]
group = "data"

# ---------------------------------------------------------------- tones
# Semantic tone -> hue, per scheme. Pages only ever use tone tokens.
[tones.light]
accent = "fjord"
neutral = "shale"      # cool-tinted surfaces and text
structure = "slate"    # chart structure: gridlines, axes, context series
info = "cobalt"
success = "malachite"
warning = "ochre"
danger = "haematite"

[tones.dark]
accent = "fjord"
neutral = "shale"
structure = "slate"
info = "cobalt"
success = "malachite"
warning = "ochre"
danger = "haematite"

# ---------------------------------------------------------------- step roles
# Role -> step (1-based), identical for every tone (EDS ADR 0016 D5).
[roles]
fill-muted = 1
fill-muted-hover = 2
fill-muted-pressed = 3
border-subtle = 4
selected = 5
border = 7
selected-pressed = 8
text-muted = 8          # labels, axis text, captions (Lc 60)
border-strong = 9
fill-emphasis = 9
fill-emphasis-hover = 10
fill-emphasis-pressed = 11
text-subtle = 11        # secondary prose, standfirst (Lc 75)
text-on-muted = 12
text-strong = 13        # body text (Lc 90)
text-on-emphasis = 15
surface = 15

# ---------------------------------------------------------------- contrast
# APCA (W3 0.0.98G) minimums, checked by tests for every hue in every scheme.
# fg/bg are role names; `tones` limits which tones must pass ("all" or a list).
[[contrast]]
fg = "text-strong"
bg = "surface"
lc = 90
tones = "all"

[[contrast]]
fg = "text-subtle"
bg = "surface"
lc = 75
tones = ["neutral", "structure"]

[[contrast]]
fg = "text-muted"
bg = "surface"
lc = 60
tones = ["accent", "neutral", "structure", "info"]

[[contrast]]
fg = "text-on-emphasis"
bg = "fill-emphasis"
lc = 60
tones = "all"

# ---------------------------------------------------------------- data colours
# Journalistic default: context in grey, the story in colour.
[data]
# Shared by every preset.
context = { hue = "slate", light = 6, dark = 6 }   # background/context series (Lc >= 30)
default_preset = "tide"

# Sequential and diverging ramp definitions; presets pick one of each.
[data.sequential]
fjord = { hue = "fjord", steps = 7, range_light = [0.96, 0.34], range_dark = [0.30, 0.92], chroma_peak = 0.09 }
cobalt = { hue = "cobalt", steps = 7, range_light = [0.96, 0.34], range_dark = [0.30, 0.92], chroma_peak = 0.13 }
shale = { hue = "shale", steps = 7, range_light = [0.96, 0.30], range_dark = [0.30, 0.94], chroma_peak = 0.05 }

[data.diverging]
# Two hue ends through a neutral; never red <-> green.
default = { low = "cobalt", high = "ochre", steps = 9, neutral_light = 0.95, neutral_dark = 0.22, end_light = 0.50, end_dark = 0.68, chroma = 0.14 }
fjord_ochre = { low = "fjord", high = "ochre", steps = 9, neutral_light = 0.95, neutral_dark = 0.22, end_light = 0.50, end_dark = 0.68, chroma = 0.12 }

# ---------------------------------------------------------------- data presets
# A preset bundles the data-colour choices. Pages switch with
# data-palette="<name>" on <html> or any container. Every preset is tested:
#
# story       - quiet, on-identity series beside grey context (1-3 used at once).
#               Low chroma, so ALWAYS direct-label. Checked: worst-case CVD OK
#               deltaE >= 0.06 and Lc >= 30 vs surface.
# highlight   - the one thing to look at. Checked: Lc >= 45 vs surface.
# categorical - identity of entities (operators, basins), fixed order. Checked
#               with the six dataviz checks (lightness band, chroma >= 0.10,
#               adjacent CVD deltaE >= 8 Machado 2009, normal-vision >= 15,
#               contrast >= 3:1). Orders found by exhaustive search; keep them.
#               More entities than slots: fold into "Other" (context grey) or
#               use small multiples; never generate extra hues.
# Entries are [hue, step_light, step_dark].

[presets.tide]
label = "Tide"
note = "Fjord story colour, ochre highlight, ochre-led identity palette."
highlight = ["ochre", 8, 8]
story = [["fjord", 9, 8], ["cobalt", 7, 10], ["shale", 11, 6], ["fjord", 6, 11]]
categorical = [["ochre", 8, 7], ["cobalt", 8, 6], ["haematite", 9, 7], ["amethyst", 9, 7], ["malachite", 10, 6]]
sequential = "fjord"
diverging = "default"

[presets.signal]
label = "Signal"
note = "Cobalt story colour, haematite highlight, haematite-led identity palette."
highlight = ["haematite", 9, 8]
story = [["cobalt", 9, 8], ["fjord", 12, 6], ["shale", 5, 9], ["cobalt", 7, 11]]
categorical = [["haematite", 8, 6], ["cobalt", 8, 6], ["ochre", 8, 7], ["amethyst", 10, 7], ["malachite", 8, 6]]
sequential = "cobalt"
diverging = "default"

[presets.frost]
label = "Frost"
note = "Cool only: fjord and shale story colours, cobalt highlight, four-slot identity palette."
highlight = ["cobalt", 9, 8]
story = [["fjord", 9, 8], ["shale", 5, 6], ["fjord", 8, 12], ["shale", 11, 10]]
categorical = [["cobalt", 8, 6], ["ochre", 8, 7], ["amethyst", 10, 7], ["malachite", 8, 6]]
sequential = "shale"
diverging = "fjord_ochre"
