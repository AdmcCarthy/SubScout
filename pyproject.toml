[project]
name = "subscout"
version = "0.1.0"
description = "Themed, journalistic data narratives with Read and Present modes"
readme = "README.md"
authors = [
    { name = "Adam McCarthy", email = "24669992+AdmcCarthy@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "coloraide>=8.14",
]

[project.scripts]
subscout = "subscout:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]
