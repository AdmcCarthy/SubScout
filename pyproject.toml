[project]
name = "subscout"
version = "0.9.0"
description = "Themed data narratives in two modes: a journalistic story, and a deck for presentation and teaching"
readme = "README.md"
authors = [
    { name = "Adam McCarthy", email = "24669992+AdmcCarthy@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "coloraide>=8.14",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
subscout = "subscout:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"src/subscout/build.py" = ["E501"]  # HTML fragments
"src/subscout/modes/*.py" = ["E501"]  # HTML fragments and messages
"src/subscout/fit.py" = ["E501"]  # embedded JavaScript and messages
"src/subscout/advice.py" = ["E501"]  # advice messages
"scripts/perf.py" = ["E501"]  # embedded JavaScript
"tests/test_build.py" = ["E501"]  # inline story fixtures
"tests/test_modes.py" = ["E501"]  # inline story fixtures
