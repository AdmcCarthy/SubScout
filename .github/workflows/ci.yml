name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: Generated tokens are up to date
        run: uv run subscout tokens && git diff --exit-code src/subscout/runtime/css
      - name: Generated symbols are up to date
        run: uv run subscout symbols && git diff --exit-code src/subscout/runtime/js/symbols-data.js src/subscout/runtime/js/symbols.json
      - name: Build site and stories
        run: uv run python scripts/build_pages.py _site
      - name: Install headless Chromium
        run: uv run playwright install --with-deps chromium
      - name: Symbols (JS composition matches Python, every symbol draws)
        run: uv run python scripts/symbols_check.py _site
      - name: Performance gate (4x CPU throttle)
        run: |
          uv run python scripts/perf.py _site demo/
          uv run python scripts/perf.py _site compare/
      - name: Readability gate (text and figure both readable at every step, phones and desktop)
        run: uv run python scripts/readability.py _site demo/
      - name: Screenshots and console errors
        run: uv run python scripts/snapshot.py _site _snapshots demo/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: _snapshots
